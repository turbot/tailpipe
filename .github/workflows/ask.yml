# Asks the area's approvers in Slack once the release PR's record is in (docs/release-ask.md). It runs when the record workflow,
# `Release PR`, finishes, on the default branch, in the repo's `slack` environment. Nothing follows the ask.
name: Ask

on:
  workflow_run:
    workflows: ["Release PR"]
    types: [completed]

permissions: {}

jobs:
  ask:
    # A record run that did not succeed asks nothing; a later record run asks.
    if: github.event.workflow_run.conclusion == 'success'
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
    uses: turbot/shipyard-workflows/.github/workflows/ask.yml@v0
    with:
      # The release PR the record run names; empty when it names none, which looks at every open release PR.
      pr: ${{ github.event.workflow_run.pull_requests[0].number }}
    secrets:
      SHIPYARD_SLACK_BOT_TOKEN: ${{ secrets.SHIPYARD_SLACK_BOT_TOKEN }}
