# Asks the release approvers in Slack to approve a release PR: calls
# Shipyard's ask, published in turbot/shipyard-workflows, at v0 like the other
# Shipyard calls (release.yml). Shipyard runs no code from this repo.
#
#   Release PR run (release-pr.yml) completes ──► this run ──► one post in
#   the channel of .github/release.json (`ask.channel`), tagging the
#   approvers of the `slack` environment's SHIPYARD_APPROVERS
#
# It asks once per release PR, and only when the PR is ready for review: a
# release PR stays a draft until its verdict is SHIP. Until then a run prints
# why and ends green, and the next Release PR run asks. It sends no reminder:
# the release manager chases approvals. The ask reads the channel from main,
# the release PR's base, so a release PR cannot change who it asks. While main
# has no `ask.channel`, a run says "Not asked" and ends green.
#
# The ask never holds a release. Its check lands on develop's tip, and
# Shipyard's record does not judge a workflow_run run (Shipyard 0.12.0).
#
# The Slack token is the org secret SHIPYARD_SLACK_BOT_TOKEN, the one that
# Shipyard's announce uses. tailpipe keeps no copy. The bot has only chat:write, in
# #releases and the channels the ask posts in, so a leaked token can post
# there and read nothing. Only Shipyard's ask job sees it.
#
# A workflow_run trigger runs this file from develop, the default branch, so
# a branch or a PR cannot start it with code of its own.
#
# The job grants what Shipyard's ask job asks for, and nothing more:
#   contents read        the facts and the prep file at the PR's head, and
#                        .github/release.json at its base
#   pull-requests write  read the release PR and its reviews, and write the
#                        note that the ask went out (read gets a 403)
#   issues read          who opened the issues that a change closes
#   id-token write       Shipyard learns its own commit, from a token with
#                        audience shipyard, which no AWS role accepts

name: Release ask

on:
  workflow_run:
    workflows: ["Release PR"]
    types: [completed]

permissions: {}

jobs:
  ask:
    name: ask
    if: github.event.workflow_run.conclusion == 'success'
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
    uses: turbot/shipyard-workflows/.github/workflows/ask.yml@v0
    with:
      # Empty when the run names no PR: then every open release PR.
      pr: ${{ github.event.workflow_run.pull_requests[0].number }}
    secrets:
      SHIPYARD_SLACK_BOT_TOKEN: ${{ secrets.SHIPYARD_SLACK_BOT_TOKEN }}
