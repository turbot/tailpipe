version: "2"
linters:
  default: none
  enable:
    - asasalint
    - asciicheck
    - bidichk
    - depguard
    - durationcheck
    - errcheck
    - forbidigo
    - gocheckcompilerdirectives
    - gocritic
    - gosec
    - govet
    - ineffassign
    - makezero
    - nilerr
    - nolintlint
    - reassign
    - sqlclosecheck
    - staticcheck
    - unconvert
    - unused
  settings:
    depguard:
      rules:
        main:
          deny:
            - pkg: go.uber.org/zap
              desc: do not use Uber zap directly, use the fplog package instead
            - pkg: github.com/pkg/errors
              desc: Should be replaced by standard lib errors package
    forbidigo:
      forbid:
        - pattern: ^(fmt\.Print(|f|ln)|print|println)$
        - pattern: ^(fmt\.Fprint(|f|ln)|print|println)$
        - pattern: ^zap\.Error$
        - pattern: ^grpc\.(Header|Trailer)$
    gocritic:
      disabled-checks:
        - ifElseChain
        - singleCaseSwitch
        - assignOp
        - commentFormatting
    nolintlint:
      require-explanation: true
      require-specific: true
    staticcheck:
      checks:
        - "all"
        - "-ST*"    # stylecheck: not previously enabled (merged into staticcheck in v2)
        - "-QF*"    # quickfix suggestions: not previously enabled (merged into staticcheck in v2)
    gosec:
      excludes:
        - G118      # added in golangci-lint v2.11 gosec ruleset; not enforced by the previously pinned version
        - G122      # added in golangci-lint v2.11 gosec ruleset; not enforced by the previously pinned version
        - G706      # false positives on logging config/environment values
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      # The newer gosec ruleset no longer flags some conversions an
      # existing //nolint:gosec directive suppressed, so nolintlint sees
      # the directive as unused. Keep the source directive (other gosec
      # versions still need it) and ignore the unused-directive report.
      - linters: [nolintlint]
        text: 'unused for linter "gosec"'
    paths:
      - tests/acceptance
      - test_apps
      - third_party$
      - builtin$
      - examples$
formatters:
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
